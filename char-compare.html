<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<title>Character — old vs new</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#13111d;color:#f4f2ff;font-family:'Press Start 2P',monospace;padding:40px;text-align:center}
  h2{font-size:14px;color:#56c7f5;margin:30px 0 14px}
  .row{display:flex;gap:26px;justify-content:center;flex-wrap:wrap}
  .cell{background:#211d33;border:5px solid #000;box-shadow:8px 8px 0 #000;padding:14px}
  .cell img{width:180px;height:180px;image-rendering:pixelated;display:block;background:#1a1630}
  .cell span{display:block;margin-top:10px;font-size:9px;color:#9b94bd}
  .tag{font-size:10px;color:#ff9b42;margin-top:6px}
</style></head><body>
  <h2>CURRENT (v1 — looked "fake")</h2>
  <div class="row">
    <div class="cell"><img src="public/assets/character/south.png"><span>south</span></div>
    <div class="cell"><img src="public/assets/character/west.png"><span>west</span></div>
    <div class="cell"><img src="public/assets/character/east.png"><span>east</span></div>
    <div class="cell"><img src="public/assets/character/north.png"><span>north</span></div>
  </div>
  <h2>NEW (v2 — higher detail, refined outline)</h2>
  <div class="row">
    <div class="cell"><img src="public/assets/character/_new/south.png"><span>south</span></div>
    <div class="cell"><img src="public/assets/character/_new/west.png"><span>west</span></div>
    <div class="cell"><img src="public/assets/character/_new/east.png"><span>east</span></div>
    <div class="cell"><img src="public/assets/character/_new/north.png"><span>north</span></div>
  </div>
  <div class="tag">scaled 1.9x · transparent PNG · 96px source</div>
</body></html>
